title: jsarticle (Typst)
author: Kazuharu Yanagimoto
version: 0.1.0
quarto-required: ">=1.8.0"
contributes:
  shortcodes:
    - js-shortcodes.lua
  formats:
    typst:
      lang: ja
      papersize: a4
      number-sections: true
      section-numbering: "1.1.1"
      template-partials:
        - typst-template.typ
        - typst-show.typ
        - page.typ
      filters:
        - path: js-noindent.lua
          at: post-quarto
